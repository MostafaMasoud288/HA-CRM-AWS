name: CI/CD Pipeline — Infra → Config

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # STAGE 1: Provision Infrastructure
  # ─────────────────────────────────────────
  terraform:
    name: 🏗️ Terraform Provision
    runs-on: ubuntu-latest

    defaults:
      run:
        # تأكد أن الفولدر اسمه terraform فعلاً في الريبو الجديد
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Create SSH Key File
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/.ssh/id_rsa.pub
          chmod 600 /home/runner/.ssh/id_rsa.pub

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=terraform.tfvars -out=tfplan

      - name: Terraform Apply
        id: apply_step
        run: terraform apply -auto-approve tfplan

      - name: Cleanup on Failure (Auto Destroy)
        if: failure() && steps.apply_step.outcome == 'failure'
        run: |
          echo "Detecting failure, starting auto-destroy to clean up resources..."
          terraform destroy -auto-approve -var-file=terraform.tfvars

     # - name: Generate Ansible inventory
     #   run: |
     #     terraform output -json instance_ips | jq -r '"[servers]", .[]' > ../ansible/inventory.ini

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          # المسار الآن أصبح بسيطاً ومباشراً
          path: terraform/inventory.ini

  # ─────────────────────────────────────────
  # STAGE 2: Configure & Run with Ansible
  # ─────────────────────────────────────────
  ansible:
    name: ⚙️ Ansible Configure & Deploy
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: ansible-inventory
          path: ansible/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install Ansible
        run: pip install ansible

      - name: Run Ansible playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i inventory.ini \
            site.yml \
            --private-key ~/.ssh/id_rsa \
            -u ubuntu
